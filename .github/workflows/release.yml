# Stages a release of the tplvane and @tplvane/mcp packages on npm with trusted publishing (OIDC) and provenance,
# without an npm token. The staged version becomes public only after a maintainer approves it
# with 2FA. See docs/RELEASING.md.
#
# Two jobs: build installs the dependencies, runs every check and packs the package, without the
# right to ask for an OIDC token. Only stage has that right, and it runs no code of the repository
# or of its dependencies: it takes the packed file from build, checks that it is the same file,
# and stages it.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  build:
    name: Build, check and pack the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      integrity: ${{ steps.pack.outputs.integrity }}
      mcp-tarball: ${{ steps.pack-mcp.outputs.tarball }}
      mcp-integrity: ${{ steps.pack-mcp.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, to check below that the tagged commit is on main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install -g npm@11.21.1
      - name: The tag matches the versions of both packages, and @tplvane/mcp depends on that tplvane
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "v$(node -p 'require("./packages/tplvane/package.json").version')" = "$TAG"
          test "v$(node -p 'require("./packages/mcp/package.json").version')" = "$TAG"
          test "$(node -p 'require("./packages/mcp/package.json").dependencies.tplvane')" = "^${TAG#v}"
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:pkg
      - name: tplvane depends only on xlvane and fflate, @tplvane/mcp only on tplvane and the MCP SDK
        run: |
          node -e 'const deps = (m) => Object.keys({ ...m.dependencies, ...m.optionalDependencies, ...m.peerDependencies }).sort().join(","); const d = deps(require("./packages/tplvane/package.json")); const m = deps(require("./packages/mcp/package.json")); if (d !== "fflate,xlvane") throw new Error("tplvane dependencies: " + d); if (m !== "@modelcontextprotocol/server,tplvane") throw new Error("@tplvane/mcp dependencies: " + m)'
      - name: Pack the package
        id: pack
        env:
          TAG: ${{ github.ref_name }}
        working-directory: packages/tplvane
        run: |
          mkdir "$RUNNER_TEMP/package"
          npm pack --json --pack-destination "$RUNNER_TEMP/package" > "$RUNNER_TEMP/pack.json"
          tarball="$(node -p 'require(process.argv[1])[0].filename' "$RUNNER_TEMP/pack.json")"
          integrity="$(node -p 'require(process.argv[1])[0].integrity' "$RUNNER_TEMP/pack.json")"
          if [ "$tarball" != "tplvane-${TAG#v}.tgz" ] || [ ! -f "$RUNNER_TEMP/package/$tarball" ]; then
            echo "::error::tplvane: npm pack did not write tplvane-${TAG#v}.tgz"
            exit 1
          fi
          case "$integrity" in
            sha512-*) ;;
            *) echo "::error::tplvane: npm pack gave no sha512 integrity for $tarball"; exit 1 ;;
          esac
          echo "$tarball $integrity"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
      - name: Pack @tplvane/mcp
        id: pack-mcp
        env:
          TAG: ${{ github.ref_name }}
        working-directory: packages/mcp
        run: |
          mkdir -p "$RUNNER_TEMP/mcp"
          npm pack --json --pack-destination "$RUNNER_TEMP/mcp" > "$RUNNER_TEMP/pack-mcp.json"
          tarball="$(node -p 'require(process.argv[1])[0].filename' "$RUNNER_TEMP/pack-mcp.json")"
          integrity="$(node -p 'require(process.argv[1])[0].integrity' "$RUNNER_TEMP/pack-mcp.json")"
          if [ "$tarball" != "tplvane-mcp-${TAG#v}.tgz" ] || [ ! -f "$RUNNER_TEMP/mcp/$tarball" ]; then
            echo "::error::tplvane: npm pack did not write tplvane-mcp-${TAG#v}.tgz"
            exit 1
          fi
          case "$integrity" in
            sha512-*) ;;
            *) echo "::error::tplvane: npm pack gave no sha512 integrity for $tarball"; exit 1 ;;
          esac
          echo "$tarball $integrity"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
      # One file each, uploaded as it is (archive: false): the artifact is named after the file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/mcp/${{ steps.pack-mcp.outputs.tarball }}
          archive: false
          if-no-files-found: error

  stage:
    name: Stage the release on npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The trusted publisher on npm names this environment, so only this job, in an environment
    # limited to tags v* (and approved by the owner), can stage a version (docs/RELEASING.md).
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@11.21.1
      # Fails when the digest of the download differs from the one recorded at upload.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.tarball }}
          path: ${{ runner.temp }}/package
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.mcp-tarball }}
          path: ${{ runner.temp }}/package
          digest-mismatch: error
      - name: The files are the packages the build job packed
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
          MCP_TARBALL: ${{ needs.build.outputs.mcp-tarball }}
          MCP_INTEGRITY: ${{ needs.build.outputs.mcp-integrity }}
        run: |
          check() {
            actual="sha512-$(node -e 'process.stdout.write(require("crypto").createHash("sha512").update(require("fs").readFileSync(process.argv[1])).digest("base64"))' "$RUNNER_TEMP/package/$1")"
            echo "$1 $actual"
            if [ "$actual" != "$2" ]; then
              echo "::error::tplvane: $1 is not the file the build job packed ($2)"
              exit 1
            fi
          }
          check "$TARBALL" "$INTEGRITY"
          check "$MCP_TARBALL" "$MCP_INTEGRITY"
      # A packed file is staged as it is: npm runs no lifecycle script for it. tplvane first, as
      # @tplvane/mcp depends on it.
      - name: Stage the packages (approve them on npmjs.com or with npm stage approve, using 2FA)
        working-directory: ${{ runner.temp }}/package
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          MCP_TARBALL: ${{ needs.build.outputs.mcp-tarball }}
        run: |
          npm stage publish "./$TARBALL" --provenance
          npm stage publish "./$MCP_TARBALL" --provenance
