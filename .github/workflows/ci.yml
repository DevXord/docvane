# Tests on every push and pull request. Actions are pinned to the commit of a release tag; the
# comment names the tag. No secrets are used, and the token can only read the repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # No npm cache here: setup-node runs the bundled npm in the repository to find the cache,
          # and the npm of Node.js 22 is older than devEngines allows (it is upgraded in the next step).
      # The npm the repository is pinned to (packageManager), so .npmrc from depcurfew applies.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:pkg
      - run: node scripts/smoke.mjs

  policy:
    name: Supply-chain policy (depcurfew)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g npm@11.21.1
      # depcurfew.json is the policy; doctor fails on configuration that does not enforce it.
      - run: npx --yes depcurfew@1.5.2 doctor

  fuzz:
    name: Property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The npm the repository is pinned to (packageManager), so .npmrc from depcurfew applies.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run fuzz
        env:
          DV_FUZZ_RUNS: '5000'

  libreoffice:
    name: LibreOffice opens the results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc
      # The npm the repository is pinned to (packageManager), so .npmrc from depcurfew applies.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run test:libreoffice

  runtimes:
    name: Bun, Deno and a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ^2.6.0
      # The npm the repository is pinned to (packageManager), so .npmrc from depcurfew applies.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run build
      - run: bun scripts/smoke.mjs
      - run: deno run --allow-read --allow-env scripts/smoke.mjs
      # Playwright only for this job, not a dependency of the repository.
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node scripts/smoke-browser.mjs
